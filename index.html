<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Колесо номеров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050507; --ink:#f4f4f7; --mut:#8c8c99; --line:#272730; --red:#ff3358;
  --f-disp:'Unbounded','Montserrat','Segoe UI',system-ui,sans-serif;
  --f-sans:'Inter','Roboto','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink); font-family:var(--f-sans); overflow-x:hidden;
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(255,51,88,.13), transparent 70%),
    radial-gradient(800px 520px at 50% 108%, rgba(255,51,88,.11), transparent 70%),
    var(--bg);
}
button{font:inherit;color:inherit;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* ---------- Раскладка ---------- */
.app{
  max-width:1100px; margin:0 auto; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  display:grid; gap:16px; grid-template-columns:minmax(0,1fr);
  grid-template-areas:"head" "stage" "wheel" "spin" "panel";
}
.top{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:700 16px var(--f-disp);
  color:#fff;border:2px solid var(--red);background:#12070c;flex:none;
  box-shadow:0 0 12px rgba(255,51,88,.6), inset 0 0 8px rgba(255,51,88,.3)}
h1{margin:0;font:700 clamp(14px,4vw,19px) var(--f-disp);letter-spacing:.02em;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:10px}
.worth{text-align:right;line-height:1.15}
.worth small{display:block;font-size:11px;color:var(--mut)}
.worth b{font:700 clamp(12px,3.4vw,15px) var(--f-disp);color:#ff6a85;text-shadow:0 0 10px rgba(255,51,88,.6);white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#0d0d13;border:1.5px solid #3a1c26;color:#ff7a92}
.icon-btn:active{transform:scale(.94)}
.wheel-col{display:contents}
.wheel-box{grid-area:wheel}
.spin-wrap{grid-area:spin}
.panel{grid-area:panel}
@media (min-width:960px){
  .app{grid-template-columns:minmax(380px,470px) minmax(0,1fr);column-gap:34px;align-items:start;
    grid-template-areas:"head head" "wheel stage" "wheel panel"}
  .wheel-col{display:flex;flex-direction:column;grid-area:wheel;gap:20px}
  .wheel-box,.spin-wrap{grid-area:auto}
  .spin-wrap{position:static!important;background:none!important;padding:0!important}
}

/* ---------- Сцена результата (по скриншоту) ---------- */
.stage{
  --c:#34343d; --cr:70,70,80; --ct:#8e8e9b; --ga:.14; --gc:#9aa0aa; --gcr:154,160,170;
  container-type:inline-size; position:relative; grid-area:stage;
  width:100%; max-width:640px; justify-self:center; cursor:default;
}
.stage.rb{--c:var(--rc,#ff3b6b);--cr:var(--rcr,255,59,107);--ct:var(--rc,#ff7aa0)}
.stage.grb{--gc:var(--rc,#ff3b6b);--gcr:var(--rcr,255,59,107)}
.stage::before{content:"";position:absolute;inset:-12% -8%;pointer-events:none;z-index:-1;
  background:radial-gradient(closest-side, rgba(var(--cr),calc(var(--ga)*.35)), transparent);}
.stage.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(3px,1px,0)}30%,50%,70%{transform:translate3d(-5px,-1px,0)}40%,60%{transform:translate3d(5px,1px,0)}}

.info{
  position:relative; display:flex; justify-content:space-between; align-items:center; gap:2cqw;
  padding:2.5cqw 3.8cqw 2.7cqw; border-radius:3.6cqw; border:2px solid var(--c);
  background:linear-gradient(180deg,#0f0f16,#09090e);
  box-shadow:0 0 1.4cqw rgba(var(--cr),var(--ga)),0 0 6cqw rgba(var(--cr),calc(var(--ga)*.5)),inset 0 0 3.2cqw rgba(var(--cr),calc(var(--ga)*.3));
  transition:border-color .6s, box-shadow .6s;
}
.info-l{width:max(39cqw,150px);flex:none;min-width:0}
.rname{font:700 max(12px,3cqw) var(--f-disp);color:var(--ct);min-height:1.35em;margin-bottom:1.6cqw;white-space:nowrap;
  opacity:0;transform:translateY(5px);transition:opacity .5s,transform .5s;
  text-shadow:0 0 1cqw rgba(var(--cr),.45)}
.s-rarity .rname{opacity:1;transform:none}
.rname.rbt{text-shadow:none}
.segwrap{position:relative}
.segbar{display:grid;grid-template-columns:repeat(9,1fr);column-gap:4.6%}
.seg{height:max(5px,.8cqw);border-radius:99px;background:#2a2a31;overflow:hidden;position:relative}
.seg b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:var(--gc);transition:background .15s}
.stage.grb .seg b{background:linear-gradient(90deg,#ff3b6b,#ffb02e,#ffe23b,#3ddc84,#35d0ff,#b25cff)}
.segbar.lit{filter:drop-shadow(0 0 .7cqw rgba(var(--gcr),.9))}
.marker{position:absolute;left:0;top:50%;width:max(10px,2cqw);aspect-ratio:1;border-radius:50%;background:#fff;
  transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  box-shadow:0 0 .9cqw var(--gc),0 0 2.4cqw var(--gc)}
.s-scale .marker{opacity:1}
.marker.stop{animation:mstop .7s ease-out}
@keyframes mstop{0%{transform:translate(-50%,-50%) scale(2.4)}60%{transform:translate(-50%,-50%) scale(.8)}100%{transform:translate(-50%,-50%) scale(1)}}
.price{font:700 max(12px,3cqw) var(--f-disp);color:var(--ct);letter-spacing:.015em;white-space:nowrap;text-align:right;opacity:0;
  text-shadow:0 0 .7cqw rgba(var(--cr),.95),0 0 2.2cqw rgba(var(--cr),.7);transform-origin:100% 50%}
.s-price .price{opacity:1}
.price.pop{animation:ppop .9s cubic-bezier(.2,1.3,.35,1) both}
@keyframes ppop{0%{transform:scale(1.55);filter:brightness(2.4);opacity:0}25%{opacity:1}100%{transform:scale(1);filter:none}}

.plate-wrap{
  margin-top:2.6cqw; opacity:.3; filter:grayscale(1) brightness(.75);
  transform:translateY(-1.6cqw) scale(.97);
  transition:opacity .7s, transform .9s cubic-bezier(.2,.9,.25,1.15), filter .6s;
}
.s-plate .plate-wrap{opacity:1;filter:none;transform:none}
.stage.spinning .plate-wrap{animation:ghost 1s ease-in-out infinite alternate}
@keyframes ghost{from{opacity:.16}to{opacity:.34}}
.plate-frame{
  padding:.95cqw; border-radius:3.9cqw; border:2px solid var(--c); background:#09090d;
  box-shadow:0 0 1.4cqw rgba(var(--cr),var(--ga)),0 0 6cqw rgba(var(--cr),calc(var(--ga)*.5)),inset 0 0 3.2cqw rgba(var(--cr),calc(var(--ga)*.3));
  transition:border-color .6s, box-shadow .6s;
}
@keyframes gpulse{
  0%,100%{box-shadow:0 0 1.4cqw rgba(var(--cr),.8),0 0 6cqw rgba(var(--cr),.4),inset 0 0 3.2cqw rgba(var(--cr),.25)}
  50%{box-shadow:0 0 2.6cqw rgba(var(--cr),1),0 0 11cqw rgba(var(--cr),.62),inset 0 0 4.4cqw rgba(var(--cr),.42)}
}
.stage.pulse .info,.stage.pulse .plate-frame{animation:gpulse 2.2s ease-in-out infinite}
.plate{
  position:relative; display:flex; align-items:stretch; aspect-ratio:1000/262; overflow:hidden;
  border-radius:3cqw; border:.55cqw solid #121217; color:#0a0a0e;
  background:linear-gradient(180deg,#f7f7f8 0%,#eeeef0 55%,#e0e0e5 100%);
  font-family:var(--f-sans); font-weight:800;
}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);transform:translateX(-130%)}
.plate.sheen::after{animation:sheen 1.3s .3s ease-out}
@keyframes sheen{to{transform:translateX(130%)}}
.pl-main{flex:0 0 71.5%;display:flex;align-items:center;justify-content:center;gap:4.3cqw;font-size:12.6cqw;line-height:1;white-space:nowrap}
.pl-b{letter-spacing:2.5cqw;margin-right:-2.5cqw}
.pl-sep{width:.7cqw;align-self:center;height:72%;background:#0d0d11;border-radius:1cqw}
.pl-reg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw}
.reg-n{font-size:9.6cqw;line-height:1;letter-spacing:.2cqw}
.reg-row{display:flex;align-items:center;gap:1.4cqw;font-size:3.3cqw;line-height:1}
.flag{display:block;width:4.9cqw;height:3.2cqw;border-radius:.4cqw;box-shadow:0 0 0 .2cqw rgba(0,0,0,.3);
  background:linear-gradient(180deg,#fff 0 33.3%,#1c57a5 33.3% 66.6%,#d52b1e 66.6%)}

.grade{
  margin-top:2.6cqw; padding:2.4cqw 3.4cqw 2.6cqw; border-radius:3.4cqw;
  border:2px solid rgba(var(--gcr),.6); background:linear-gradient(180deg,#0e0e15,#09090e);
  box-shadow:0 0 2.4cqw rgba(var(--gcr),.38),inset 0 0 2.6cqw rgba(var(--gcr),.12);
  opacity:0; transform:translateY(2cqw) scale(.98); pointer-events:none;
  transition:opacity .6s, transform .7s cubic-bezier(.2,1.2,.35,1);
}
.s-grade .grade{opacity:1;transform:none}
.g-top{display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw}
.g-lab{font:600 max(11px,2.2cqw) var(--f-sans);color:var(--mut);margin-bottom:.6cqw}
.g-name{font:700 max(20px,6.4cqw) var(--f-disp);color:var(--gc);text-shadow:0 0 1.4cqw rgba(var(--gcr),.85);line-height:1.05}
.g-right{text-align:right}
.g-score{font:700 max(13px,3.2cqw) var(--f-disp);color:var(--ink)}
.rec{display:none;margin-top:1cqw;font:700 max(10px,2cqw) var(--f-sans);color:#1a1200;background:#ffc234;border-radius:99px;padding:.5cqw 2cqw;
  box-shadow:0 0 1.6cqw rgba(255,194,52,.8)}
.rec.show{display:inline-block;animation:recin .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes recin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqw;margin-top:2.4cqw}
@container (min-width:520px){.pills{grid-template-columns:repeat(8,1fr)}}
.pill{font:700 max(10px,1.95cqw) var(--f-sans);text-align:center;padding:1cqw 0;border-radius:99px;border:1px solid #2a2a33;color:#5f5f6b;
  transition:background .12s,color .12s,box-shadow .12s;white-space:nowrap}
.pill.on{color:#0a0a0e;background:var(--pc);border-color:var(--pc);box-shadow:0 0 1.8cqw var(--pc)}
.pill.rbp.on{background:linear-gradient(90deg,#ff3b6b,#ffb02e,#ffe23b,#3ddc84,#35d0ff,#b25cff);border-color:transparent}
.pill.pop{animation:ppill .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes ppill{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.hint{text-align:center;font-size:11.5px;color:var(--mut);margin-top:10px;opacity:0;transition:opacity .4s;height:14px}
.stage.revealing .hint{opacity:.8}
.stage.revealing{cursor:pointer}

/* радужные тексты */
.rbt{background:linear-gradient(90deg,#ff3b6b,#ffb02e,#ffe23b,#3ddc84,#35d0ff,#b25cff,#ff3b6b);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;animation:rbslide 3s linear infinite}
@keyframes rbslide{to{background-position:250% 0}}

/* ---------- Колесо ---------- */
.wheel-box{
  position:relative; width:100%; max-width:460px; aspect-ratio:1; justify-self:center; border-radius:50%;
  container-type:inline-size; border:3px solid var(--red);
  background:radial-gradient(circle,#0b0b10 62%,#1a0a10 100%);
  box-shadow:0 0 22px rgba(255,51,88,.7),0 0 80px rgba(255,51,88,.28),inset 0 0 28px rgba(255,51,88,.3);
}
.wheel-box.impact{animation:impact .5s ease-out}
@keyframes impact{0%{transform:scale(1)}30%{transform:scale(1.025)}100%{transform:scale(1)}}
.wheel-box::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--wc,#fff);opacity:0;pointer-events:none}
.wheel-box.flash::after{animation:ring .9s ease-out}
@keyframes ring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
.rim{position:absolute;inset:0;pointer-events:none}
.rim i{position:absolute;inset:0}
.rim b{position:absolute;top:2.3%;left:50%;width:2.2%;aspect-ratio:1;margin-left:-1.1%;border-radius:50%;
  background:#ffd0d9;box-shadow:0 0 6px var(--red);animation:blink 1.4s ease-in-out infinite alternate}
.rim i:nth-child(odd) b{animation-delay:.7s}
.wheel-box.spinning .rim b{animation-duration:.22s}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.wheel-rot{position:absolute;inset:7%;border-radius:50%;overflow:hidden;will-change:transform;
  box-shadow:0 0 0 3px #0a0a0e,0 0 0 5px rgba(255,51,88,.65)}
.wheel-rot canvas{display:block;width:100%;height:100%}
.hub{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;z-index:4;
  border:1.2cqw solid #0a0a0e;color:#0a0a0e;font:800 3.5cqw/1 var(--f-sans);
  background:radial-gradient(circle at 35% 28%,#fff,#dcdce2 72%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;
  box-shadow:0 0 0 .5cqw var(--red),0 0 5cqw rgba(255,51,88,.8)}
.hub .flag{width:6.4cqw;height:4.2cqw}
.hub:active:not(:disabled){transform:translate(-50%,-50%) scale(.95)}
.hub:disabled{cursor:default}
.pointer{position:absolute;top:-3.2%;left:50%;width:10.5%;transform:translateX(-50%);z-index:6;pointer-events:none;
  filter:drop-shadow(0 0 7px rgba(255,51,88,.95));transform-origin:50% 14%}
.pointer svg{display:block;width:100%;height:auto}

.spin-wrap{position:sticky;bottom:0;z-index:30;padding:12px 0 max(6px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(5,5,7,0),rgba(5,5,7,.92) 32%)}
.spin-btn{display:block;width:100%;max-width:460px;margin:0 auto;padding:18px 22px;border-radius:999px;
  font:700 clamp(15px,4.4vw,19px) var(--f-disp);letter-spacing:.04em;color:#fff;border:2px solid var(--red);
  background:linear-gradient(180deg,#210c14,#0e0a10);position:relative;overflow:hidden;
  box-shadow:0 0 18px rgba(255,51,88,.6),0 0 54px rgba(255,51,88,.25),inset 0 0 18px rgba(255,51,88,.28);
  text-shadow:0 0 12px rgba(255,51,88,.9);transition:transform .12s, opacity .2s}
.spin-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);
  transform:translateX(-120%);animation:btnshine 3.6s 1s infinite}
@keyframes btnshine{60%,100%{transform:translateX(120%)}}
.spin-btn:active:not(:disabled){transform:scale(.97)}
.spin-btn:disabled{opacity:.6;cursor:default}
.spin-btn:disabled::after{animation:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- Панель: история / статистика / шансы ---------- */
.panel{background:linear-gradient(180deg,#0e0e15,#09090d);border:1px solid #2a1c23;border-radius:20px;padding:12px;min-width:0}
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px;background:#07070a;border:1px solid #23232b}
.tab{flex:1;border:0;background:transparent;border-radius:99px;padding:10px 6px;color:var(--mut);font:600 13px var(--f-sans)}
.tab[aria-selected="true"]{color:#fff;background:#1a0d13;box-shadow:inset 0 0 0 1px var(--red),0 0 12px rgba(255,51,88,.35)}
.pane{display:none;padding-top:10px}
.pane.on{display:block}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:26px 8px;line-height:1.45}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid #1a1a21;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow:active{background:#12121a}
.mini{display:inline-flex;align-items:baseline;gap:.35em;background:#f1f1f3;color:#0a0a0e;font:800 15px var(--f-sans);
  padding:4px 9px;border-radius:8px;border:2px solid var(--c,#999);box-shadow:0 0 9px rgba(var(--cr,150,150,150),.5);white-space:nowrap}
.mini small{font-size:10px;font-weight:800;opacity:.75}
.mini.rbw{border-color:transparent;box-shadow:0 0 9px rgba(255,120,200,.55);
  background:linear-gradient(#f1f1f3,#f1f1f3) padding-box,linear-gradient(90deg,#ff3b6b,#ffb02e,#3ddc84,#35d0ff,#b25cff) border-box}
.hmid{min-width:0;font-size:13px;line-height:1.35}
.hmid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmid .g{color:var(--mut)}
.hp{font:600 12px var(--f-disp);text-align:right;color:#ffd0d8;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#0b0b11;border:1px solid #22222b;border-radius:14px;padding:10px 12px;min-width:0}
.stat small{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.stat b{font:700 14px var(--f-disp);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sub{font:600 13px var(--f-sans);color:var(--mut);margin:14px 2px 6px}
.dist{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:4px 0;font-size:12.5px}
.dist .bar{height:8px;border-radius:99px;background:#1b1b22;overflow:hidden}
.dist .bar i{display:block;height:100%;border-radius:99px;min-width:0}
.dist .dv{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.odds{width:100%;border-collapse:collapse;font-size:13px}
.odds th{font-weight:600;color:var(--mut);text-align:left;padding:4px 4px 8px;font-size:12px}
.odds td{padding:8px 4px;border-top:1px solid #1a1a21;vertical-align:middle}
.odds .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:12px 2px 0}
.reset{margin-top:16px;width:100%;padding:12px;border-radius:12px;background:#12090d;border:1px solid #4a2230;color:#ff8da1;font:600 13px var(--f-sans)}
.reset.arm{background:#3a0f1b;color:#fff;border-color:var(--red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .stage.shake,.stage.pulse .info,.stage.pulse .plate-frame,.rim b,.spin-btn::after,.rbt{animation:none!important}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="sr" id="live" aria-live="polite"></div>

<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">№</div><h1>Колесо номеров</h1></div>
    <div class="top-r">
      <div class="worth"><small>Коллекция</small><b id="worth">0 ₽</b></div>
      <button class="icon-btn" id="soundBtn" aria-label="Звук"></button>
    </div>
  </header>

  <section class="stage idle" id="stage">
    <div class="info" id="info">
      <div class="info-l">
        <div class="rname" id="rName">&nbsp;</div>
        <div class="segwrap"><div class="segbar" id="segbar"></div><i class="marker" id="marker"></i></div>
      </div>
      <div class="price" id="price">0 ₽</div>
    </div>

    <div class="plate-wrap" id="plateWrap">
      <div class="plate-frame" id="plateFrame">
        <div class="plate" id="plate">
          <div class="pl-main"><span id="plA">?</span><span id="plD">???</span><span class="pl-b" id="plB">??</span></div>
          <div class="pl-sep"></div>
          <div class="pl-reg"><div class="reg-n" id="plR">??</div><div class="reg-row"><span>RUS</span><i class="flag"></i></div></div>
        </div>
      </div>
    </div>

    <div class="grade" id="grade">
